version: '3.8'

services:
  postgres_shard_1:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: forge_shard_1
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forge_shard_1"]
      interval: 3s
      timeout: 3s
      retries: 5

  postgres_shard_2:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: forge_shard_2
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forge_shard_2"]
      interval: 3s
      timeout: 3s
      retries: 5

  postgres_shard_3:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: forge_shard_3
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forge_shard_3"]
      interval: 3s
      timeout: 3s
      retries: 5

  etcd1:
    image: quay.io/coreos/etcd:v3.5.9
    command:
      - /usr/local/bin/etcd
      - --name=etcd1
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --initial-cluster-token=forge-etcd-cluster
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new

  etcd2:
    image: quay.io/coreos/etcd:v3.5.9
    command:
      - /usr/local/bin/etcd
      - --name=etcd2
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --initial-cluster-token=forge-etcd-cluster
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new

  etcd3:
    image: quay.io/coreos/etcd:v3.5.9
    command:
      - /usr/local/bin/etcd
      - --name=etcd3
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --initial-cluster-token=forge-etcd-cluster
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new

  scheduler1:
    build:
      context: ..
      dockerfile: scheduler/Dockerfile
    environment:
      SCHEDULER_ID: forge-scheduler-1
      ETCD_ENDPOINTS: etcd1:2379,etcd2:2379,etcd3:2379
      SHARDS_CONFIG: shard-1=postgresql://postgres:postgrespassword@postgres_shard_1:5432/forge_shard_1?sslmode=disable,shard-2=postgresql://postgres:postgrespassword@postgres_shard_2:5432/forge_shard_2?sslmode=disable,shard-3=postgresql://postgres:postgrespassword@postgres_shard_3:5432/forge_shard_3?sslmode=disable
      METRICS_PORT: "2113"

  scheduler2:
    build:
      context: ..
      dockerfile: scheduler/Dockerfile
    environment:
      SCHEDULER_ID: forge-scheduler-2
      ETCD_ENDPOINTS: etcd1:2379,etcd2:2379,etcd3:2379
      SHARDS_CONFIG: shard-1=postgresql://postgres:postgrespassword@postgres_shard_1:5432/forge_shard_1?sslmode=disable,shard-2=postgresql://postgres:postgrespassword@postgres_shard_2:5432/forge_shard_2?sslmode=disable,shard-3=postgresql://postgres:postgrespassword@postgres_shard_3:5432/forge_shard_3?sslmode=disable
      METRICS_PORT: "2113"

  worker1:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      WORKER_ID: forge-worker-1
      ETCD_ENDPOINTS: etcd1:2379,etcd2:2379,etcd3:2379
      SHARDS_CONFIG: shard-1=postgresql://postgres:postgrespassword@postgres_shard_1:5432/forge_shard_1?sslmode=disable,shard-2=postgresql://postgres:postgrespassword@postgres_shard_2:5432/forge_shard_2?sslmode=disable,shard-3=postgresql://postgres:postgrespassword@postgres_shard_3:5432/forge_shard_3?sslmode=disable
      ASSIGNED_SHARDS: shard-1,shard-2
      METRICS_PORT: "2112"

  worker2:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      WORKER_ID: forge-worker-2
      ETCD_ENDPOINTS: etcd1:2379,etcd2:2379,etcd3:2379
      SHARDS_CONFIG: shard-1=postgresql://postgres:postgrespassword@postgres_shard_1:5432/forge_shard_1?sslmode=disable,shard-2=postgresql://postgres:postgrespassword@postgres_shard_2:5432/forge_shard_2?sslmode=disable,shard-3=postgresql://postgres:postgrespassword@postgres_shard_3:5432/forge_shard_3?sslmode=disable
      ASSIGNED_SHARDS: shard-2,shard-3
      METRICS_PORT: "2112"

  worker3:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      WORKER_ID: forge-worker-3
      ETCD_ENDPOINTS: etcd1:2379,etcd2:2379,etcd3:2379
      SHARDS_CONFIG: shard-1=postgresql://postgres:postgrespassword@postgres_shard_1:5432/forge_shard_1?sslmode=disable,shard-2=postgresql://postgres:postgrespassword@postgres_shard_2:5432/forge_shard_2?sslmode=disable,shard-3=postgresql://postgres:postgrespassword@postgres_shard_3:5432/forge_shard_3?sslmode=disable
      ASSIGNED_SHARDS: shard-1,shard-3
      METRICS_PORT: "2112"

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      SHARDS_CONFIG: shard-1=postgresql://postgres:postgrespassword@postgres_shard_1:5432/forge_shard_1?sslmode=disable,shard-2=postgresql://postgres:postgrespassword@postgres_shard_2:5432/forge_shard_2?sslmode=disable,shard-3=postgresql://postgres:postgrespassword@postgres_shard_3:5432/forge_shard_3?sslmode=disable
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres_shard_1:5432/forge_shard_1?sslmode=disable
      MAX_QUEUE_DEPTH: "1000"

  prometheus:
    image: prom/prometheus:v2.45.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.0.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
