version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: forge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forge"]
      interval: 3s
      timeout: 3s
      retries: 5

  etcd1:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: forge-etcd1
    command:
      - /usr/local/bin/etcd
      - --name=etcd1
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --initial-cluster-token=etcd-cluster-1
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
    ports:
      - "2379:2379"

  etcd2:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: forge-etcd2
    command:
      - /usr/local/bin/etcd
      - --name=etcd2
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --initial-cluster-token=etcd-cluster-1
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new

  etcd3:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: forge-etcd3
    command:
      - /usr/local/bin/etcd
      - --name=etcd3
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --initial-cluster-token=etcd-cluster-1
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new

  scheduler1:
    build:
      context: ..
      dockerfile: scheduler/Dockerfile
    container_name: forge-scheduler-1
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/forge?sslmode=disable
      ETCD_ENDPOINTS: etcd1:2379,etcd2:2379,etcd3:2379
      SCHEDULER_ID: scheduler-1
    depends_on:
      postgres:
        condition: service_healthy
      etcd1:
        condition: service_started

  scheduler2:
    build:
      context: ..
      dockerfile: scheduler/Dockerfile
    container_name: forge-scheduler-2
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/forge?sslmode=disable
      ETCD_ENDPOINTS: etcd1:2379,etcd2:2379,etcd3:2379
      SCHEDULER_ID: scheduler-2
    depends_on:
      postgres:
        condition: service_healthy
      etcd1:
        condition: service_started

  worker1:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    container_name: forge-worker-1
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/forge?sslmode=disable
      WORKER_ID: worker-1
    depends_on:
      postgres:
        condition: service_healthy

  worker2:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    container_name: forge-worker-2
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/forge?sslmode=disable
      WORKER_ID: worker-2
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: forge-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/forge
      MAX_QUEUE_DEPTH: "1000"
    depends_on:
      postgres:
        condition: service_healthy
