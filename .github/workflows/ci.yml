name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go-lint-test:
    name: Go Lint & Test (-race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Tests with Race Detector
        run: |
          go test -race -v ./shared/... ./worker/... ./scheduler/...

  python-lint-test:
    name: Python API & SDK Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov httpx ruff mypy structlog psycopg[binary] fastapi uvicorn pydantic pydantic-settings prometheus-client hatchling
          pip install -e ./api -e ./sdk

      - name: Run Ruff Linter
        run: |
          ruff check api/ app/ sdk/ forge_sdk/ || true

      - name: Run Pytest
        run: |
          pytest -v api/tests/ sdk/tests/

  docker-integration:
    name: Docker Compose Integration Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Compose Services
        run: |
          docker compose -f deploy/docker-compose.yml config
